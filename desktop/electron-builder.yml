appId: io.github.ycsx.codebase-memory.desktop
productName: Codebase Memory
artifactName: codebase-memory-desktop-${version}-${arch}.${ext}
asar: true
directories:
  output: dist
files:
  - src/**/*
  - assets/icon.png
  - package.json
  - node_modules/lucide/**/*
win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Codebase Memory
  runAfterFinish: true
mac:
  icon: assets/icon.png
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    CFBundleDisplayName: 风暴之眼
  target:
    - dmg
  extraResources:
    - from: resources/bin/codebase-memory-mcp
      to: bin/codebase-memory-mcp
    - from: ../LICENSE
      to: LICENSE
    - from: resources/THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
dmg:
  title: 风暴之眼 ${version}
