server {
    listen 9766 ssl;
    server_name codebase-memory-mcp.internal;

    ssl_certificate     /etc/codebase-memory-mcp/tls/server.crt;
    ssl_certificate_key /etc/codebase-memory-mcp/tls/server.key;

    location = /mcp {
        proxy_pass http://127.0.0.1:19766/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        # Overwrite, do not append: the MCP server trusts this proxy's value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 1m;
    }
}
